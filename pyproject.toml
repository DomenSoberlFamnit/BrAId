  "h11>=0.16.0",
  "h5py>=3.15.1",
  "httpcore>=1.0.9",
  "httpx>=0.28.1",
  "idna>=3.20",
  "Jinja2>=3.1.6",
  "keras-nightly>=3.16.0.dev2026102803",
  "kiwisolver>=1.5.1",
  "libclang>=18.1.1",
  "markdown-it-py>=4.2.0",
  "MarkupSafe>=3.0.4",
