[project.urls]
Documentation = "https://github.com/DomenSoberlFamnit/BrAId#readme"
Issues = "https://github.com/DomenSoberlFamnit/BrAId/issues"
Source = "https://github.com/DomenSoberlFamnit/BrAId"

[tool.hatch.version]
path = "braid/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:braid}"

[tool.coverage.run]
source_pkgs = ["braid"]
branch = true
parallel = true
omit = [
  "braid/__about__.py",
]

[tool.coverage.paths]
pybraid = ["braid", "*/BrAId/braid"]
tests = []

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
