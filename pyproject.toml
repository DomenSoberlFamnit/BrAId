[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "braid"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Domen Šoberl", email = "domen.soberl@famnit.upr.si" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
"absl-py==2.3.1",
"astunparse==1.6.3",
"certifi==2025.11.12",
"charset-normalizer==3.4.4",
"contourpy==1.3.3",
"cuda-bindings==12.9.4",
"cuda-pathfinder==1.3.4",
"cycler==0.12.1",
"filelock==3.21.2",
"flatbuffers==25.9.23",
"fonttools==4.61.1",
"fsspec==2026.2.0",
"gast==0.6.0",
"google-pasta==0.2.0",
"graphviz==0.21",
"grpcio==1.76.0",
"h5py==3.14.0",
"idna==3.11",
"Jinja2==3.1.6",
"keras-nightly==3.12.0.dev2025100703",
"kiwisolver==1.4.9",
"libclang==18.1.1",
"lxml==6.1.1",
"Markdown==3.10",
"markdown-it-py==4.0.0",
"MarkupSafe==3.0.3",
"matplotlib==3.10.8",
"mdurl==0.1.2",
"ml_dtypes==0.5.4",
"mpmath==1.3.0",
"namex==0.1.0",
"networkx==3.6.1",
"numpy==2.3.5",
"nvidia-cublas-cu12==12.9.1.4",
"nvidia-cuda-cupti-cu12==12.9.79",
"nvidia-cuda-nvcc-cu12==12.9.86",
"nvidia-cuda-nvrtc-cu12==12.9.86",
"nvidia-cuda-runtime-cu12==12.9.79",
"nvidia-cudnn-cu12==9.16.0.29",
"nvidia-cufft-cu12==11.4.1.4",
"nvidia-cufile-cu12==1.13.1.3",
"nvidia-curand-cu12==10.3.10.19",
"nvidia-cusolver-cu12==11.7.5.82",
"nvidia-cusparse-cu12==12.5.10.65",
"nvidia-cusparselt-cu12==0.7.1",
"nvidia-nccl-cu12==2.28.9",
"nvidia-nvjitlink-cu12==12.9.86",
"nvidia-nvshmem-cu12==3.4.5",
"nvidia-nvtx-cu12==12.8.90",
"opencv-python==4.13.0.92",
"opt_einsum==3.4.0",
"optree==0.18.0",
"packaging==25.0",
"pandas==2.3.3",
"pillow==12.0.0",
"polars==1.38.1",
"polars-runtime-32==1.38.1",
"progress==1.6.1",
"protobuf==6.33.1",
"psutil==7.2.2",
"pydot==4.0.1",
"Pygments==2.19.2",
"pyparsing==3.3.1",
"python-dateutil==2.9.0.post0",
"pytz==2025.2",
"PyYAML==6.0.3",
"requests==2.32.5",
"rich==14.2.0",
"scipy==1.17.0",
"setuptools==80.9.0",
"six==1.17.0"
]

[project.urls]
Documentation = "https://github.com/DomenSoberlFamnit/BrAId#readme"
Issues = "https://github.com/DomenSoberlFamnit/BrAId/issues"
Source = "https://github.com/DomenSoberlFamnit/BrAId"

[tool.hatch.version]
path = "braid/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:braid}"

[tool.coverage.run]
source_pkgs = ["braid"]
branch = true
parallel = true
omit = [
  "braid/__about__.py",
]

[tool.coverage.paths]
pybraid = ["braid", "*/BrAId/braid"]
tests = []

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
