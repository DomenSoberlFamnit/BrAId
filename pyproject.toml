[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "braid"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Domen Šoberl", email = "domen.soberl@famnit.upr.si" },
]
